<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上帝模拟器 — God Simulator</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}

/* ── Theme Variables ── */
:root{
  --bg:#0a0e14;--bg-soft:#0d1117;--surface:#161b22;--surface-2:#1c2330;--border:#30363d;--border-soft:#21262d;
  --text:#e6edf3;--muted:#8b949e;--faint:#6e7681;
  --accent:#58a6ff;--accent-soft:rgba(88,166,255,.12);
  --green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#f0883e;
  --card-bg:#161b22;--overlay:rgba(4,8,16,.7);
  --font-mono:'SF Mono','Cascadia Code','Fira Code','Consolas',monospace;
}
[data-theme="light"]{
  --bg:#f6f8fa;--bg-soft:#f0f2f5;--surface:#ffffff;--surface-2:#f6f8fa;--border:#d0d7de;--border-soft:#e4e9ee;
  --text:#1f2328;--muted:#656d76;--faint:#8c959f;
  --accent:#0969da;--accent-soft:rgba(9,105,218,.08);
  --green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--purple:#8250df;--orange:#bc4c00;
  --card-bg:#ffffff;--overlay:rgba(31,35,40,.4);
}

html{scroll-behavior:smooth}
body{min-height:100vh;font-family:var(--font-mono);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;
  background-image:radial-gradient(circle at 15% 0%,rgba(88,166,255,.07),transparent 45%),radial-gradient(circle at 85% 100%,rgba(188,140,255,.06),transparent 45%)}

#app{display:flex;flex-direction:column;min-height:100vh;max-width:1280px;margin:0 auto;padding:0 20px}

/* ── Top bar ── */
.top-bar{display:flex;align-items:center;gap:14px;padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--accent-soft);border:1px solid var(--border);border-radius:10px}
.brand > div{min-width:0}
.brand h1{font-size:19px;font-weight:700;letter-spacing:1px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand .sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-bar-actions{display:flex;gap:8px;flex:none}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--text);transition:border-color .15s,background .15s,transform .1s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn:active{transform:scale(.94)}

/* ── Pill (preset indicator) ── */
.preset-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 12px;cursor:pointer;transition:border-color .15s,color .15s;white-space:nowrap}
.preset-pill:hover{border-color:var(--accent);color:var(--text)}
.preset-pill b{color:var(--accent);font-weight:700}

/* ── Main layout: two columns on desktop ── */
.main-content{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding-bottom:8px;align-items:start}
.col-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.col-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media(max-width:960px){
  .main-content{grid-template-columns:1fr}
  .col-side{position:static}
}

/* ── Panel ── */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px;border-bottom:1px solid var(--border-soft);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.panel-head .badge{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;text-transform:none;letter-spacing:0}
.panel-body{padding:14px 16px}

/* ── World state grid ── */
#stateGrid{display:flex;flex-direction:column;gap:10px}
details.category{border:1px solid var(--border-soft);border-radius:10px;background:var(--bg-soft);overflow:hidden}
details.category>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--text);user-select:none;transition:background .15s}
details.category>summary::-webkit-details-marker{display:none}
details.category>summary:hover{background:var(--surface-2)}
details.category>summary .chev{font-size:9px;color:var(--faint);transition:transform .2s}
details.category[open]>summary .chev{transform:rotate(90deg)}
details.category>summary .cat-name{color:var(--accent)}
details.category>summary .cat-count{margin-left:auto;font-size:11px;color:var(--faint);font-weight:400}
details.category .grid{padding:10px 12px 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;background:var(--card-bg);border:1px solid var(--border-soft);border-radius:10px;padding:13px 12px 11px;text-align:center;transition:border-color .15s,box-shadow .2s}
.card:hover{border-color:var(--accent);box-shadow:0 3px 14px rgba(0,0,0,.18)}
.card .key{font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card .trend{position:absolute;top:7px;right:9px;font-size:10px;font-weight:700}
.card .trend.up{color:var(--green)}
.card .trend.down{color:var(--red)}
.card.flash-up{animation:flashUp .7s ease}
.card.flash-down{animation:flashDown .7s ease}
.card.flash-new{animation:flashNew .9s ease}
@keyframes flashUp{0%{background:rgba(63,185,80,.28);border-color:var(--green)}100%{background:var(--card-bg)}}
@keyframes flashDown{0%{background:rgba(248,81,73,.28);border-color:var(--red)}100%{background:var(--card-bg)}}
@keyframes flashNew{0%{background:rgba(210,153,34,.4);transform:scale(1.04)}100%{background:var(--card-bg);transform:scale(1)}}
.empty-hint{padding:26px 10px;text-align:center;color:var(--faint);font-size:12.5px}

/* ── Warnings ── */
.warnings{display:none;border:1px solid rgba(210,153,34,.45);background:rgba(210,153,34,.08);border-radius:10px;padding:10px 14px}
.warnings.show{display:block}
.warnings .warn-title{font-size:12px;font-weight:700;color:var(--yellow);margin-bottom:4px}
.warnings li{font-size:12px;color:var(--muted);margin-left:16px;margin-bottom:2px}

/* ── Oracle composer ── */
.oracle-panel .panel-body{display:flex;flex-direction:column;gap:10px}
.oracle-row{display:flex;gap:10px;align-items:stretch}
.oracle-row textarea{flex:1;resize:none;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:var(--font-mono);font-size:13.5px;outline:none;min-height:46px;max-height:120px;line-height:1.5;transition:border-color .15s}
.oracle-row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.oracle-row textarea::placeholder{color:var(--faint)}
.btn{border:none;border-radius:10px;padding:0 18px;font-family:var(--font-mono);font-size:13.5px;font-weight:600;cursor:pointer;transition:filter .15s,transform .1s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;white-space:nowrap}
.btn-primary:hover:not(:disabled){filter:brightness(1.12)}

/* ── Strength slider ── */
.strength-row{display:flex;align-items:center;gap:12px}
.strength-label{font-size:12px;color:var(--muted);flex:none;display:flex;align-items:center;gap:5px}
.strength-slider{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--yellow) 55%,var(--red));outline:none;cursor:pointer}
.strength-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 5px rgba(0,0,0,.4);cursor:grab;transition:transform .1s}
.strength-slider::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.15)}
.strength-slider::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 5px rgba(0,0,0,.4);cursor:grab}
.strength-val{flex:none;min-width:64px;text-align:right;font-size:12px;font-weight:700;color:var(--accent)}

/* ── Preset quick-switch (inline in side panel) ── */
.quick-presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qp-btn{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 10px;cursor:pointer;text-align:left;font-family:var(--font-mono);transition:border-color .15s,background .15s,transform .1s}
.qp-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.qp-btn.active{border-color:var(--accent);background:var(--accent-soft)}
.qp-btn .qp-name{font-size:13px;font-weight:700;color:var(--text)}
#qpCustom{grid-column:1 / -1}
.qp-btn .qp-desc{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.custom-config{margin-top:10px;display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px}
.custom-row{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.custom-row textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-family:var(--font-mono);font-size:12.5px;resize:vertical;outline:none;min-height:56px}
.custom-row textarea:focus{border-color:var(--accent)}
.custom-slider{-webkit-appearance:none;appearance:none;height:5px;border-radius:999px;background:var(--bg-soft);outline:none;cursor:pointer;width:100%}
.custom-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:grab}
.custom-slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:grab}
.custom-val{color:var(--accent);font-weight:700}

/* ── Meta info in side panel ── */
.meta-list{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.meta-list .meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta-list .meta-k{color:var(--muted)}
.meta-list .meta-v{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.countdown-big{font-size:26px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;line-height:1}
.controls-btns{display:flex;gap:8px;margin-top:4px}
.controls-btns .btn{flex:1;padding:9px 0;font-size:12.5px}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-ghost.danger{color:var(--red)}
.btn-ghost.danger:hover{border-color:var(--red)}

/* ── Log panel ── */
.log-tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px}
.log-tabs button{flex:1;background:transparent;border:none;border-radius:6px;padding:5px 10px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.log-tabs button.active{background:var(--accent);color:#fff}
.debug pre{background:var(--bg);border-top:1px solid var(--border-soft);padding:12px 14px;max-height:260px;overflow:auto;font-size:11.5px;color:var(--green);white-space:pre-wrap;word-break:break-all;line-height:1.5}

/* ── Spinner & status ── */
.spinner{display:none;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.spinner.show{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.status-line{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--muted);min-height:18px;padding:4px 0}
.status-line.error{color:var(--red)}
.status-line.ok{color:var(--green)}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(3px)}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px 22px;width:92%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.5);transform:translateY(14px) scale(.98);transition:transform .2s}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}
.modal h2{font-size:16px;color:var(--text);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);margin-bottom:15px}
.modal input[type="text"],.modal input[type="password"],.modal input[type="number"]{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:var(--font-mono);font-size:13px;outline:none;width:100%;transition:border-color .15s}
.modal input:focus{border-color:var(--accent)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

/* ── Footer ── */
footer{text-align:center;padding:14px 0 16px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--border-soft);margin-top:auto}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--accent)}

/* ── Responsive ── */
@media(max-width:640px){
  #app{padding:0 12px}
  .brand h1{font-size:16px}
  .brand h1 em{display:none}
  .brand .sub{display:none}
  .top-bar{gap:8px}
  .preset-pill{padding:4px 10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .card .value{font-size:19px}
  .oracle-row{flex-direction:column}
  .btn-primary{padding:10px 0}
  .quick-presets{grid-template-columns:1fr 1fr}
  .modal{width:95%;padding:20px 16px}
}
</style>
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header class="top-bar">
    <div class="brand">
      <div class="logo">🌍</div>
      <div>
        <h1>上帝模拟器 <em>God Simulator</em></h1>
        <div class="sub">以神谕推动世界演变 · LLM 实时推演</div>
      </div>
    </div>
    <button class="preset-pill" id="presetPill" title="当前创造力预设">🎨 <b id="presetPillName">均衡</b></button>
    <div class="top-bar-actions">
      <button class="icon-btn" id="btnTheme" title="切换主题">🌙</button>
      <button class="icon-btn" id="btnSettings" title="设置">⚙️</button>
    </div>
  </header>

  <!-- Main -->
  <div class="main-content">
    <!-- Left column: world + oracle -->
    <div class="col-main">
      <!-- World state -->
      <section class="panel">
        <div class="panel-head">📊 世界状态 <span class="badge" id="stateBadge">0 类</span></div>
        <div class="panel-body">
          <div id="stateGrid"></div>
        </div>
      </section>

      <!-- Warnings -->
      <div class="warnings" id="warnBox">
        <div class="warn-title">⚠️ LLM 输出已自动规范化</div>
        <ul id="warnList"></ul>
      </div>

      <!-- Oracle composer -->
      <section class="panel oracle-panel">
        <div class="panel-head">⚡ 神谕</div>
        <div class="panel-body">
          <div class="oracle-row">
            <textarea id="oracleInput" rows="1" placeholder="向世界宣告你的神谕…（Enter 发送，Shift+Enter 换行）"></textarea>
            <button class="btn btn-primary" id="btnOracle">⚡ 发送</button>
          </div>
          <div class="strength-row">
            <span class="strength-label">🪄 影响强度</span>
            <input type="range" class="strength-slider" id="strengthSlider" min="0" max="100" step="5" value="50">
            <span class="strength-val" id="strengthVal">50 · 普通</span>
          </div>
        </div>
      </section>

      <div class="status-line" id="statusBar"><span class="spinner" id="spinner"></span><span id="statusText">就绪</span></div>
    </div>

    <!-- Right column: controls + log -->
    <aside class="col-side">
      <!-- Control panel -->
      <section class="panel">
        <div class="panel-head">🕹 控制台</div>
        <div class="panel-body">
          <div class="meta-list">
            <div class="meta-row"><span class="meta-k">下次自然演变</span><span class="countdown-big" id="cdDisplay">-</span></div>
            <div class="meta-row"><span class="meta-k">创造力预设</span><span class="meta-v" id="metaPreset">均衡</span></div>
            <div class="meta-row"><span class="meta-k">演变轮数</span><span class="meta-v" id="metaTicks">0</span></div>
          </div>
          <div class="controls-btns">
            <button class="btn btn-ghost" id="btnPause">⏸ 暂停</button>
            <button class="btn btn-ghost" id="btnEvolveNow">🔄 立即演变</button>
          </div>
        </div>
      </section>

      <!-- Quick presets -->
      <section class="panel">
        <div class="panel-head">🎨 创造力预设</div>
        <div class="panel-body">
          <div class="quick-presets" id="quickPresets">
            <button type="button" class="qp-btn" data-preset="realistic">
              <span class="qp-name">📔 写实</span>
              <span class="qp-desc">贴近现实 · 沉稳可信</span>
            </button>
            <button type="button" class="qp-btn active" data-preset="balanced">
              <span class="qp-name">⚖️ 均衡</span>
              <span class="qp-desc">现实与想象平衡</span>
            </button>
            <button type="button" class="qp-btn" data-preset="fantasy">
              <span class="qp-name">🐉 奇幻</span>
              <span class="qp-desc">魔法·龙族·脑洞</span>
            </button>
            <button type="button" class="qp-btn" data-preset="chaotic">
              <span class="qp-name">🌋 疯狂</span>
              <span class="qp-desc">天马行空·剧变</span>
            </button>
            <button type="button" class="qp-btn" data-preset="custom" id="qpCustom">
              <span class="qp-name">✨ 自定义</span>
              <span class="qp-desc">自调温度 · 写规则</span>
            </button>
          </div>
          <div class="custom-config" id="customConfig" hidden>
            <label class="custom-row">🎛 温度 <span class="custom-val" id="customTempVal">1.0</span>
              <input type="range" class="custom-slider" id="customTemp" min="0" max="2" step="0.1" value="1.0">
            </label>
            <label class="custom-row">📜 世界提示词
              <textarea id="customPrompt" rows="3" placeholder="描述你想要的演化风格/规则…（效果等同写实/均衡等预设，留空则均衡自然）。仅决定世界内容与风格，不改变输出格式。"></textarea>
            </label>
          </div>
        </div>
      </section>

      <!-- Log -->
      <section class="panel debug">
        <div class="panel-head">🖥 运行日志
          <div class="log-tabs">
            <button id="tabCleaned" class="active" type="button">规范化</button>
            <button id="tabRaw" type="button">原始输出</button>
          </div>
        </div>
        <pre id="debugLog">等待第一次数据…</pre>
      </section>
    </aside>
  </div>

  <footer>
    本项目采用 GPL-3.0 License 开源 © 2026 HaveCake ·
    <a href="https://github.com/HaveCake/worldbox" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>⚙️ 设置</h2>
    <label>API Base URL
      <input id="cfgUrl" type="text" placeholder="https://api.openai.com（留空用服务器默认）">
    </label>
    <label>API Key
      <input id="cfgKey" type="password" placeholder="sk-...（留空用服务器默认）">
    </label>
    <label>Model
      <input id="cfgModel" type="text" placeholder="gpt-4o（留空用服务器默认）">
    </label>
    <label>Tick 间隔（秒）
      <input id="cfgTick" type="number" min="1" value="10">
    </label>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnSaveSettings">💾 保存并关闭</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ── DOM refs ── */
  const cfgUrl     = document.getElementById("cfgUrl");
  const cfgKey     = document.getElementById("cfgKey");
  const cfgModel   = document.getElementById("cfgModel");
  const cfgTick    = document.getElementById("cfgTick");
  const grid       = document.getElementById("stateGrid");
  const stateBadge = document.getElementById("stateBadge");
  const debugLog   = document.getElementById("debugLog");
  const cdDisplay  = document.getElementById("cdDisplay");
  const metaPreset = document.getElementById("metaPreset");
  const metaTicks  = document.getElementById("metaTicks");
  const btnPause   = document.getElementById("btnPause");
  const btnEvolveNow = document.getElementById("btnEvolveNow");
  const oracleIn   = document.getElementById("oracleInput");
  const btnOracle  = document.getElementById("btnOracle");
  const strengthSlider = document.getElementById("strengthSlider");
  const strengthVal= document.getElementById("strengthVal");
  const statusBar  = document.getElementById("statusText");
  const statusLine = document.getElementById("statusBar");
  const spinner    = document.getElementById("spinner");
  const btnSettings= document.getElementById("btnSettings");
  const btnSave    = document.getElementById("btnSaveSettings");
  const modalOverlay= document.getElementById("modalOverlay");
  const btnTheme   = document.getElementById("btnTheme");
  const warnBox    = document.getElementById("warnBox");
  const warnList   = document.getElementById("warnList");
  const tabCleaned = document.getElementById("tabCleaned");
  const tabRaw     = document.getElementById("tabRaw");
  const presetPill = document.getElementById("presetPill");
  const presetPillName = document.getElementById("presetPillName");
  const quickPresets = document.getElementById("quickPresets");
  const customConfig = document.getElementById("customConfig");
  const customTempInput = document.getElementById("customTemp");
  const customTempVal = document.getElementById("customTempVal");
  const customPromptInput = document.getElementById("customPrompt");

  /* ── State ── */
  const INITIAL_STATE = {
    "自然生态": { "树木": 125, "环境质量": 100 },
    "人类社会": { "人口": 50 }
  };
  let currentState = JSON.parse(JSON.stringify(INITIAL_STATE));
  let previousState = {};
  let paused = false;
  let countdown = 0;
  let tickTimer = null;
  let requesting = false;
  let creativity = "balanced";
  let customTemp = 1.0;
  let customPromptText = "";
  let tickCount = 0;

  const PRESETS = {
    realistic: { label: "写实", temperature: 0.7 },
    balanced:  { label: "均衡", temperature: 1.0 },
    fantasy:   { label: "奇幻", temperature: 1.3 },
    chaotic:   { label: "疯狂", temperature: 1.7 }
  };

  const STRENGTH_TIERS = [
    { max: 25, label: "微弱" },
    { max: 50, label: "普通" },
    { max: 75, label: "强烈" },
    { max: 100, label: "颠覆" }
  ];

  function setPreset(key) {
    const isCustom = key === "custom";
    creativity = isCustom ? "custom" : (PRESETS[key] ? key : "balanced");
    const label = creativity === "custom" ? "自定义" : PRESETS[creativity].label;
    document.querySelectorAll(".qp-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.preset === creativity);
    });
    presetPillName.textContent = label;
    metaPreset.textContent = label;
    customConfig.hidden = creativity !== "custom";
  }

  document.querySelectorAll(".qp-btn").forEach(btn => {
    btn.addEventListener("click", () => setPreset(btn.dataset.preset));
  });
  presetPill.addEventListener("click", () => {
    modalOverlay.classList.add("active");
  });

  customTempInput.addEventListener("input", () => {
    customTemp = Number(customTempInput.value);
    customTempVal.textContent = customTemp.toFixed(1);
  });
  customPromptInput.addEventListener("input", () => {
    customPromptText = customPromptInput.value;
  });

  /* ── Strength slider ── */
  function strengthLabel(v) {
    for (const t of STRENGTH_TIERS) if (v <= t.max) return t.label;
    return "颠覆";
  }
  strengthSlider.addEventListener("input", () => {
    const v = Number(strengthSlider.value);
    strengthVal.textContent = v + " · " + strengthLabel(v);
  });

  /* ── Theme ── */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    btnTheme.textContent = theme === "dark" ? "🌙" : "☀️";
    localStorage.setItem("worldbox_theme", theme);
  }
  btnTheme.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") || "dark";
    applyTheme(cur === "dark" ? "light" : "dark");
  });
  applyTheme(localStorage.getItem("worldbox_theme") || "dark");

  /* ── Settings modal ── */
  btnSettings.addEventListener("click", () => modalOverlay.classList.add("active"));
  btnSave.addEventListener("click", () => {
    saveConfig();
    modalOverlay.classList.remove("active");
  });
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) {
      saveConfig();
      modalOverlay.classList.remove("active");
    }
  });

  /* ── localStorage ── */
  function saveConfig() {
    const cfg = {
      apiUrl: cfgUrl.value,
      apiKey: cfgKey.value,
      model: cfgModel.value,
      tick: cfgTick.value,
      creativity: creativity,
      customTemp: creativity === "custom" ? customTemp : undefined,
      customPrompt: creativity === "custom" ? customPromptText : undefined,
      strength: Number(strengthSlider.value)
    };
    localStorage.setItem("worldbox_cfg", JSON.stringify(cfg));
  }

  function loadConfig() {
    try {
      const cfg = JSON.parse(localStorage.getItem("worldbox_cfg"));
      if (cfg) {
        cfgUrl.value   = cfg.apiUrl  || "";
        cfgKey.value   = cfg.apiKey  || "";
        cfgModel.value = cfg.model   || "";
        cfgTick.value  = cfg.tick    || 10;
        if (cfg.customTemp !== undefined || cfg.customPrompt !== undefined) {
          if (cfg.customTemp !== undefined) customTemp = Math.max(0, Math.min(2, Number(cfg.customTemp) || 1.0));
          if (cfg.customPrompt !== undefined) customPromptText = String(cfg.customPrompt);
          customTempInput.value = customTemp;
          customTempVal.textContent = customTemp.toFixed(1);
          customPromptInput.value = customPromptText;
        }
        if (cfg.creativity === "custom") {
          setPreset("custom");
        } else if (cfg.creativity && PRESETS[cfg.creativity]) {
          setPreset(cfg.creativity);
        } else if (cfg.temperature !== undefined) {
          const t = Number(cfg.temperature);
          let best = "balanced", diff = Infinity;
          for (const [k, p] of Object.entries(PRESETS)) {
            const d = Math.abs(p.temperature - t);
            if (d < diff) { diff = d; best = k; }
          }
          setPreset(best);
        } else {
          setPreset("balanced");
        }
        if (cfg.strength !== undefined) {
          strengthSlider.value = Math.max(0, Math.min(100, Number(cfg.strength) || 50));
        }
      } else {
        setPreset("balanced");
      }
    } catch (e) { console.warn("loadConfig:", e); }
    // Refresh derived UI
    strengthVal.textContent = strengthSlider.value + " · " + strengthLabel(Number(strengthSlider.value));
  }

  /* ── Defensive coercion (mirrors server) ── */
  function coerceNumber(value) {
    if (typeof value === "number") return Number.isFinite(value) ? value : undefined;
    if (typeof value === "string") {
      const trimmed = value.trim();
      if (trimmed === "") return undefined;
      const n = Number(trimmed.replace(/,/g, "").replace(/[ \t]/g, ""));
      return Number.isFinite(n) ? n : undefined;
    }
    if (typeof value === "boolean") return value ? 1 : 0;
    return undefined;
  }
  function safeNumber(value, prevValue) {
    const n = coerceNumber(value);
    if (n !== undefined) return Math.round(Math.max(0, Math.min(1000000, n)));
    const p = coerceNumber(prevValue);
    if (p !== undefined) return Math.round(Math.max(0, Math.min(1000000, p)));
    return 0;
  }
  function isNestedState(state) {
    return Object.values(state).some(v => typeof v === "object" && v !== null && !Array.isArray(v));
  }
  function sanitizeState(state, prevState) {
    if (!state || typeof state !== "object" || Array.isArray(state)) {
      return prevState && !Array.isArray(prevState) ? sanitizeState(prevState, null) : { "世界状态": { "稳定性": 100 } };
    }
    const prev = prevState && typeof prevState === "object" && !Array.isArray(prevState) ? prevState : {};
    const out = {};
    if (isNestedState(state)) {
      for (const [cat, val] of Object.entries(state)) {
        if (val && typeof val === "object" && !Array.isArray(val)) {
          const prevCat = prev[cat] && typeof prev[cat] === "object" ? prev[cat] : {};
          const catObj = {};
          for (const [attr, attrVal] of Object.entries(val)) {
            catObj[attr] = safeNumber(attrVal, prevCat[attr]);
          }
          out[cat] = catObj;
        } else {
          out[cat] = safeNumber(val, prev[cat]);
        }
      }
      return out;
    }
    for (const [attr, val] of Object.entries(state)) out[attr] = safeNumber(val, prev[attr]);
    return { "世界状态": out };
  }

  /* ── Render ── */
  function escapeHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function renderState() {
    grid.innerHTML = "";
    const cats = Object.keys(currentState);
    stateBadge.textContent = cats.length + " 类";
    if (!cats.length) {
      grid.innerHTML = '<div class="empty-hint">世界尚在虚无中…发送一条神谕或等待下一次演变。</div>';
      return;
    }
    if (isNestedState(currentState)) {
      cats.forEach(cat => {
        const val = currentState[cat];
        if (val && typeof val === "object" && !Array.isArray(val)) {
          const details = document.createElement("details");
          details.className = "category";
          details.open = true;
          const summary = document.createElement("summary");
          summary.innerHTML = '<span class="chev">▶</span><span class="cat-name">' + escapeHtml(cat) + '</span>';
          const count = document.createElement("span");
          count.className = "cat-count";
          count.textContent = Object.keys(val).length + " 项";
          summary.appendChild(count);
          details.appendChild(summary);
          const subGrid = document.createElement("div");
          subGrid.className = "grid";
          const prevCat = (previousState && typeof previousState[cat] === "object") ? previousState[cat] : {};
          Object.keys(val).forEach(key => subGrid.appendChild(createCard(key, val[key], prevCat[key])));
          details.appendChild(subGrid);
          grid.appendChild(details);
        } else {
          grid.appendChild(createCard(cat, val, previousState[cat]));
        }
      });
    } else {
      const wrap = document.createElement("div");
      wrap.className = "grid";
      cats.forEach(key => wrap.appendChild(createCard(key, currentState[key], previousState[key])));
      grid.appendChild(wrap);
    }
  }

  function createCard(key, val, oldVal) {
    const card = document.createElement("div");
    card.className = "card";
    let trendHtml = "";
    if (oldVal === undefined) {
      card.classList.add("flash-new");
    } else if (typeof val === "number" && typeof oldVal === "number") {
      if (val > oldVal) { card.classList.add("flash-up"); const d = val - oldVal; trendHtml = '<span class="trend up">▲' + d + '</span>'; }
      else if (val < oldVal) { card.classList.add("flash-down"); const d = val - oldVal; trendHtml = '<span class="trend down">▼' + Math.abs(d) + '</span>'; }
    }
    card.innerHTML = trendHtml +
      '<div class="key">' + escapeHtml(key) + '</div>' +
      '<div class="value">' + escapeHtml(String(val)) + '</div>';
    return card;
  }

  /* ── Log ── */
  let logMode = "cleaned";
  let lastLog = { cleaned: null, raw: null };
  function setLogMode(mode) {
    logMode = mode;
    tabCleaned.className = mode === "cleaned" ? "active" : "";
    tabRaw.className = mode === "raw" ? "active" : "";
    refreshDebug();
  }
  function refreshDebug() {
    const v = lastLog[logMode];
    debugLog.textContent = (v === null || v === undefined)
      ? "等待第一次数据…"
      : "[" + new Date().toLocaleTimeString() + "]\n" + JSON.stringify(v, null, 2);
  }
  function appendDebugLog(cleaned, raw) {
    lastLog = { cleaned: cleaned, raw: (raw !== undefined ? raw : cleaned) };
    refreshDebug();
  }
  tabCleaned.addEventListener("click", () => setLogMode("cleaned"));
  tabRaw.addEventListener("click", () => setLogMode("raw"));

  /* ── Warnings ── */
  function showWarnings(warnings) {
    warnList.innerHTML = "";
    if (Array.isArray(warnings) && warnings.length) {
      warnings.forEach(w => {
        const li = document.createElement("li");
        li.textContent = w;
        warnList.appendChild(li);
      });
      warnBox.classList.add("show");
    } else {
      warnBox.classList.remove("show");
    }
  }

  /* ── Status ── */
  function setStatus(msg, kind) {
    statusBar.textContent = msg;
    statusLine.className = "status-line" + (kind ? " " + kind : "");
  }
  function setLoading(loading, msg) {
    spinner.classList.toggle("show", loading);
    btnOracle.disabled = loading;
    btnEvolveNow.disabled = loading;
    if (loading) setStatus(msg || "🔄 正在推演世界…");
  }

  /* ── API ── */
  async function callEvolve(userPrompt) {
    const apiUrl = cfgUrl.value.trim();
    const apiKey = cfgKey.value.trim();
    const model  = cfgModel.value.trim();
    const strength = Number(strengthSlider.value);

    requesting = true;
    setLoading(true, "🔄 正在推演世界…");

    const backendUrl = (location.origin.includes("file://") ? "http://localhost:3000" : location.origin) + "/evolve";

    try {
      const resp = await fetch(backendUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          apiUrl,
          apiKey,
          model,
          creativity,
          temperature: creativity === "custom" ? customTemp : undefined,
          custom_prompt: creativity === "custom" ? customPromptText : undefined,
          oracle_strength: strength,
          current_state: currentState,
          user_prompt: userPrompt || ""
        })
      });

      let data;
      const raw = await resp.text();
      try {
        data = JSON.parse(raw);
      } catch {
        setLogMode("raw");
        appendDebugLog(null, { raw_response: raw });
        setStatus("❌ 响应解析失败：后端返回了非 JSON 内容", "error");
        return false;
      }

      if (!resp.ok) {
        const errMsg = (data && data.error) || ("HTTP " + resp.status);
        appendDebugLog(null, { http_status: resp.status, body: data });
        setStatus("❌ 后端错误: " + errMsg, "error");
        return false;
      }

      let cleanedState = data;
      let rawState = null;
      let warnings = [];
      if (data && typeof data === "object" && "state" in data) {
        cleanedState = data.state;
        rawState = (data.raw !== undefined) ? data.raw : null;
        warnings = data.warnings || [];
      }

      const sanitized = sanitizeState(cleanedState, currentState);
      appendDebugLog(sanitized, rawState);
      showWarnings(warnings);

      previousState = JSON.parse(JSON.stringify(currentState));
      currentState = sanitized;
      tickCount++;
      metaTicks.textContent = tickCount;
      renderState();
      setStatus(userPrompt ? "⚡ 神谕已生效 — " + new Date().toLocaleTimeString() : "✅ 世界已演变 — " + new Date().toLocaleTimeString(), "ok");
      return true;
    } catch (err) {
      appendDebugLog(null, { error: err.message });
      setStatus("❌ 网络错误: " + err.message, "error");
      return false;
    } finally {
      requesting = false;
      setLoading(false);
    }
  }

  /* ── Timer ── */
  function getTickSeconds() {
    const v = parseInt(cfgTick.value, 10);
    return (v && v > 0) ? v : 10;
  }
  function startCountdown() {
    stopCountdown();
    countdown = getTickSeconds();
    cdDisplay.textContent = countdown + "s";
    tickTimer = setInterval(() => {
      if (paused || requesting) return;
      countdown--;
      cdDisplay.textContent = Math.max(countdown, 0) + "s";
      if (countdown <= 0) {
        stopCountdown();
        callEvolve("").then(() => startCountdown());
      }
    }, 1000);
  }
  function stopCountdown() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  /* ── Pause / evolve-now ── */
  btnPause.addEventListener("click", () => {
    paused = !paused;
    btnPause.textContent = paused ? "▶ 继续" : "⏸ 暂停";
    btnPause.classList.toggle("danger", paused);
  });
  btnEvolveNow.addEventListener("click", async () => {
    if (requesting) return;
    stopCountdown();
    await callEvolve("");
    startCountdown();
  });

  /* ── Oracle send ── */
  btnOracle.addEventListener("click", async () => {
    const text = oracleIn.value.trim();
    if (!text || requesting) return;
    oracleIn.value = "";
    oracleIn.style.height = "auto";
    stopCountdown();
    await callEvolve(text);
    startCountdown();
  });
  oracleIn.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      btnOracle.click();
    }
  });
  oracleIn.addEventListener("input", () => {
    oracleIn.style.height = "auto";
    oracleIn.style.height = Math.min(oracleIn.scrollHeight, 120) + "px";
  });

  /* ── Init ── */
  loadConfig();
  setLogMode("cleaned");
  previousState = {};
  renderState();
  startCountdown();
})();
</script>
</body>
</html>
